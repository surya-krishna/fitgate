name: CLA
# Asks first-time contributors to sign CLA.md with a single PR comment, then
# records the signature so they are never asked again. Signatures are stored as
# JSON on the `cla-signatures` branch of this repo — nothing external to set up,
# and no secret beyond the automatic GITHUB_TOKEN.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, closed]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: ${{ github.server_url }}/${{ github.repository }}/blob/main/CLA.md
          path-to-signatures: signatures/v1/cla.json
          branch: cla-signatures
          allowlist: dependabot[bot],renovate[bot]
          custom-notsigned-prcomment: >
            Thanks for the PR — this is the tribe working as intended.

            Before we can merge, we need you to sign the
            [Contributor License Agreement](${{ github.server_url }}/${{ github.repository }}/blob/main/CLA.md).
            You keep the copyright in your work; the CLA lets us offer commercial
            licenses alongside the AGPL, which is what funds development of the free
            version. It's a one-time thing.

            To sign, reply to this PR with exactly:
          custom-pr-sign-comment: "I have read the CLA Document and I hereby sign the CLA"
          custom-allsigned-prcomment: "All contributors have signed the CLA. ✍️"
